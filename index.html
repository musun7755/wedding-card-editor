<style>

  }
  @font-face {

    src: url('https://cdn.jsdelivr.net/gh/musun7755/wedding-card-editor@74cc700a9ba8f44a777de7fcf9e3a913b09df9fb/assets/fonts/ProperScript-Regular.woff2') format('woff2'),

  :root {
    --ui-bg:#f3f1ed;
    --panel:#ffffff;
    --text:#222;
    --muted:#767676;
    --line:#e7e4df;
  }
  * { box-sizing:border-box; }
  body { margin:0; font-family:-apple-system,BlinkMacSystemFont,"PingFang TC","Noto Sans TC","Microsoft JhengHei",sans-serif; color:var(--text); background:var(--ui-bg); }
  .app { min-height:100vh; display:grid; grid-template-columns:minmax(290px,360px) 1fr; gap:22px; padding:22px; }
  .sidebar { align-self:start; position:sticky; top:22px; max-height:calc(100vh - 44px); overflow:auto; padding-right:14px; scrollbar-gutter:stable; }
  .sidebar::-webkit-scrollbar { width:7px; }
  .sidebar::-webkit-scrollbar-track { background:transparent; }
  .sidebar::-webkit-scrollbar-thumb { background:#d2ccc3; border-radius:999px; }
  .sidebar::-webkit-scrollbar-thumb:hover { background:#bdb4a8; }
  .sidebar-head { padding:0 4px 14px; }
  .title-lockup { display:flex; align-items:center; gap:12px; margin-bottom:5px; }
  .title-logo { width:34px; height:34px; flex:0 0 auto; color:#8d765b; opacity:.92; }
  .title-logo svg { width:100%; height:100%; display:block; }
  .sidebar-head h1 { margin:0; font-family:"Noto Serif TC","Source Han Serif TC","Songti TC",serif; font-size:22px; font-weight:500; letter-spacing:.04em; }
  .author { font-family:"Noto Serif TC","Source Han Serif TC","Songti TC",serif; font-size:12px; font-weight:400; letter-spacing:.08em; text-transform:uppercase; color:#777; padding-left:46px; }
  .author a { color:#5f6670; text-decoration:none; border-bottom:1px solid #cfd3d8; letter-spacing:.04em; text-transform:none; }
  .author a:hover { color:#222; border-bottom-color:#777; }
  .panel { background:var(--panel); border:1px solid #dedbd5; border-radius:0; padding:20px 18px; box-shadow:0 7px 22px rgba(52,44,35,.035); }
  .hint { font-size:12px; color:var(--muted); line-height:1.55; margin-bottom:18px; }
  .group { padding:16px 0; border-top:1px solid var(--line); }
  .group:first-of-type { border-top:0; padding-top:2px; }
  .group.advanced-group { border-top:0; padding-top:0; }
  .group-title { font-family:"Noto Serif TC","Source Han Serif TC","Songti TC",serif; font-size:15px; font-weight:500; letter-spacing:.04em; margin-bottom:12px; color:#403b36; }
  label { display:block; font-size:12px; color:#666; margin:10px 0 5px; }
  input[type="text"], select { width:100%; height:40px; border:1px solid #dedbd6; border-radius:10px; padding:0 11px; font:inherit; background:white; color:#222; outline:none; }
  input[type="text"]:focus, select:focus { border-color:#bba58e; box-shadow:0 0 0 3px rgba(154,118,80,.10); }
  input[type="file"] { width:100%; font-size:12px; }
  input[type="range"] { width:100%; accent-color:#8c6d50; }
  .range-row { display:grid; grid-template-columns:1fr 46px; align-items:center; gap:8px; }
  .range-row.has-edit { grid-template-columns:minmax(0,1fr) 68px; }
  .range-value { text-align:right; font-size:11px; color:#777; font-variant-numeric:tabular-nums; }
  .range-value-edit { display:flex; align-items:center; gap:2px; color:#777; font-size:12px; }
  .range-value-edit input { width:100%; min-width:0; height:34px; padding:0 4px; border:1px solid #dedbd6; border-radius:7px; background:#fff; color:#333; font-size:13px; font-variant-numeric:tabular-nums; text-align:right; outline:none; appearance:textfield; }
  .range-value-edit input:focus { border-color:#bba58e; box-shadow:0 0 0 3px rgba(154,118,80,.10); }
  .range-value-edit input::-webkit-inner-spin-button, .range-value-edit input::-webkit-outer-spin-button { -webkit-appearance:none; margin:0; }
  .row2 { display:grid; grid-template-columns:1fr 1fr; gap:10px; }
  .toggle-row { display:flex; align-items:center; gap:8px; margin:10px 0 2px; font-size:12px; color:#555; }
  .toggle-row input { width:auto; margin:0; }
  .group-title-row { display:flex; align-items:center; justify-content:space-between; gap:10px; margin-bottom:10px; }
  .group-title-row .group-title { margin:0; }
  .round-check { appearance:none; -webkit-appearance:none; width:22px; height:22px; margin:0; border:1px solid #cfcac3; border-radius:999px; background:#fff; display:grid; place-items:center; cursor:pointer; transition:.16s ease; }
  .round-check::after { content:'✓'; font-size:14px; line-height:1; color:#fff; opacity:0; transform:scale(.75); transition:.16s ease; }
  .round-check:checked { background:#8c6d50; border-color:#8c6d50; }
  .round-check:checked::after { opacity:1; transform:scale(1); }
  .position-row { display:grid; grid-template-columns:1fr 112px; gap:10px; align-items:end; }
  .position-row > div { min-width:0; }
  .advanced { border:1px solid #e3dfd9; border-radius:12px; background:#faf9f7; padding:0 12px; }
  .advanced summary { cursor:pointer; list-style:none; padding:12px 0; font-size:12px; font-weight:650; color:#4b4b4b; }
  .advanced summary::-webkit-details-marker { display:none; }
  .advanced summary::after { content:'＋'; float:right; color:#999; font-weight:400; }
  .advanced[open] summary::after { content:'－'; }
  .advanced-body { border-top:0; padding:2px 0 12px; }
  .color-grid { display:grid; grid-template-columns:1fr 1fr; gap:10px; }
  input[type="color"] { width:100%; height:38px; border:1px solid #dedbd6; border-radius:9px; padding:0; background:#fff; overflow:hidden; cursor:pointer; }
  input[type="color"]::-webkit-color-swatch-wrapper { padding:0; }
  input[type="color"]::-webkit-color-swatch { border:0; border-radius:8px; }
  input[type="color"]::-moz-color-swatch { border:0; border-radius:8px; }
  .actions { display:grid; grid-template-columns:1fr 1fr; gap:10px; padding-top:0; }
  button { height:43px; border:0; border-radius:11px; font:inherit; font-weight:650; cursor:pointer; }
  .primary { background:#222; color:white; }
  .secondary { background:#f1efec; color:#333; }
  .stage { display:flex; align-items:flex-start; justify-content:center; min-width:0; }
  .preview-wrap { width:min(100%, 720px, calc(80dvh - 64px)); }
  .preview-toolbar { display:flex; justify-content:space-between; align-items:center; gap:12px; margin-bottom:10px; color:#777; font-size:12px; }
  .preview-toolbar-actions { display:flex; align-items:center; gap:10px; }
  .preview-expand-button { display:none; }
  .preview { width:100%; aspect-ratio:4/5; display:block; filter:drop-shadow(0 16px 28px rgba(0,0,0,.12)); border-radius:18px; }
  .drop-note { text-align:center; font-size:11px; color:#999; margin-top:8px; }
  .small { font-size:11px; color:#8b8b8b; margin-top:8px; line-height:1.45; }
  .font-choice-label { display:flex; align-items:baseline; justify-content:space-between; gap:10px; }
  .font-sample { max-width:58%; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; color:#403b36; font-size:19px; font-weight:400; line-height:1.2; }
  .font-sample.is-loading, .font-sample.is-error { color:#8b8277; font-family:inherit !important; font-size:11px; }
  .mobile-tabs, .mobile-actions { display:none; }
  @media (max-width: 860px) {
    html, body { height:100%; }
    body { overflow:hidden; }
    .app {
      height:100dvh;
      min-height:0;
      display:grid;
      grid-template-columns:1fr;
      grid-template-rows:auto auto minmax(0,1fr);
      gap:0;
      padding:0 12px;
    }
    .sidebar { display:contents; }
    .sidebar-head {
      grid-row:1;
      position:relative;
      padding:10px 4px 7px;
      background:var(--ui-bg);
      z-index:30;
    }
    .title-lockup { gap:9px; margin-bottom:2px; }
    .title-logo { width:27px; height:27px; }
    .sidebar-head h1 { font-size:18px; letter-spacing:.055em; }
    .author { padding-left:36px; font-size:10px; letter-spacing:.10em; }
    .stage {
      grid-row:2;
      min-width:0;
      display:flex;
      justify-content:center;
      align-items:center;
      padding:4px 0 12px;
      background:var(--ui-bg);
      border-bottom:1px solid #ded9d2;
      z-index:25;
    }
    .preview-wrap { width:min(calc(100vw - 36px), clamp(190px, 28dvh, 240px)); }
    .preview-toolbar { margin-bottom:6px; font-size:10px; letter-spacing:.02em; }
    .preview-expand-button { display:block; width:auto; height:30px; padding:0 9px; border:1px solid #cfc8bf; border-radius:0; background:transparent; color:#5f554a; font-size:11px; font-weight:500; white-space:nowrap; }
    .preview { filter:drop-shadow(0 10px 20px rgba(0,0,0,.10)); border-radius:14px; }
    .drop-note { display:none; }
    body.preview-expanded .stage { position:fixed; inset:0; z-index:1201; display:block; overflow:auto; overscroll-behavior:contain; -webkit-overflow-scrolling:touch; padding:calc(50px + env(safe-area-inset-top)) 0 calc(20px + env(safe-area-inset-bottom)); border:0; }
    body.preview-expanded .preview-wrap { width:min(600px, 160vw); margin:0 auto; }
    body.preview-expanded .preview-toolbar { margin-bottom:8px; font-size:12px; }
    body.preview-expanded .preview-expand-button { position:fixed; top:calc(12px + env(safe-area-inset-top)); right:16px; z-index:1202; background:var(--ui-bg); }
    body.preview-expanded .drop-note { display:none; }
    .panel {
      grid-row:3;
      min-height:0;
      overflow-y:auto;
      overscroll-behavior:contain;
      -webkit-overflow-scrolling:touch;
      position:static;
      border:0;
      border-radius:0;
      box-shadow:none;
      background:transparent;
      padding:0 4px calc(16px + env(safe-area-inset-bottom));
      scrollbar-width:thin;
    }
    .panel::-webkit-scrollbar { width:4px; }
    .panel::-webkit-scrollbar-thumb { background:#cfc8bf; border-radius:999px; }
    .hint { display:none; }
    .mobile-tabs {
      position:sticky;
      top:0;
      z-index:45;
      display:grid;
      grid-template-columns:repeat(4,1fr);
      background:rgba(243,241,237,.94);
      -webkit-backdrop-filter:blur(12px);
      backdrop-filter:blur(12px);
      border-bottom:1px solid #dcd7d0;
    }
    .mobile-tab {
      position:relative;
      height:38px;
      padding:0 2px;
      border:0;
      border-radius:0;
      background:transparent;
      cursor:pointer;
      touch-action:manipulation;
      -webkit-tap-highlight-color:transparent;
      color:#827b73;
      font-family:"Noto Serif TC","Source Han Serif TC","Songti TC",serif;
      font-size:12px;
      font-weight:500;
      letter-spacing:.03em;
    }
    .mobile-tab::after {
      content:'';
      position:absolute;
      left:28%; right:28%; bottom:-1px;
      height:1px;
      background:transparent;
      transition:.18s ease;
    }
    .mobile-tab.active { color:#4f453b; }
    .mobile-tab.active::after { background:#92785b; left:20%; right:20%; }
    .panel > .group.mobile-panel { display:none; }
    .panel > .group.mobile-panel.mobile-active { display:block; }
    .panel > .group.mobile-panel.mobile-first { border-top:0; padding-top:12px; }
    .group { padding:13px 2px; }
    .group-title { font-size:14px; margin-bottom:9px; }
    label { font-size:11px; margin-top:10px; }
    input[type="text"], select { height:38px; border-radius:0; border-color:#d9d4cd; background:rgba(255,255,255,.82); font-size:13px; }
    input[type="text"]:focus, select:focus { box-shadow:none; border-color:#9f866a; }
    .advanced { border-radius:0; background:rgba(255,255,255,.58); }
    input[type="color"] { border-radius:0; }
    input[type="color"]::-webkit-color-swatch { border-radius:0; }
    input[type="color"]::-moz-color-swatch { border-radius:0; }
    .desktop-action-group { display:none !important; }
    .mobile-actions {
      position:absolute;
      top:10px;
      right:4px;
      display:flex;
      gap:6px;
    }
    .mobile-actions button { width:auto; height:30px; padding:0 9px; border-radius:0; font-size:11px; font-weight:500; letter-spacing:0; white-space:nowrap; }
    .mobile-actions .secondary { background:transparent; border:1px solid #cfc8bf; }
    .mobile-actions .primary { background:#292724; }
  }
  .export-overlay[hidden] { display:none; }
  .export-overlay { position:fixed; inset:0; z-index:1400; display:grid; place-items:center; padding:20px; background:rgba(27,25,23,.68); }
  .export-dialog { width:min(100%,390px); max-height:calc(100dvh - 40px); overflow:auto; padding:18px; background:var(--ui-bg); box-shadow:0 18px 50px rgba(0,0,0,.22); }
  .export-dialog-head { display:flex; justify-content:space-between; align-items:center; gap:12px; margin-bottom:12px; }
  .export-dialog h2 { margin:0; font-size:17px; font-weight:600; letter-spacing:.04em; }
  .export-close { width:32px; height:32px; flex:0 0 auto; border:1px solid #cfc8bf; border-radius:0; background:transparent; font-size:20px; font-weight:400; line-height:1; }
  .export-image { display:block; width:min(100%,220px); max-height:42dvh; margin:0 auto 12px; object-fit:contain; }
  .export-help { margin:0 0 14px; color:#625c54; font-size:12px; line-height:1.6; }
  .export-actions { display:flex; gap:8px; }
  .export-actions button { flex:1; height:40px; border-radius:0; font-size:12px; }
  .export-actions button[hidden] { display:none; }
  .export-status { min-height:1.5em; margin:10px 0 0; color:#8b4b44; font-size:12px; }

  /* Subtle foreground falling decoration */
  .falling-foreground {
    position:fixed;
    inset:0;
    overflow:hidden;
    pointer-events:none;
    z-index:1000;
  }
  .falling-piece {
    position:absolute;
    top:-12vh;
    left:var(--left);
    width:var(--size);
    height:var(--size);
    color:var(--fall-color, #a79682);
    opacity:0;
    will-change:transform, opacity;
    animation:gentleFall var(--duration) linear var(--delay) infinite;
    filter:brightness(1.08) drop-shadow(0 0 4px rgba(224,190,142,.62)) drop-shadow(0 0 10px rgba(224,190,142,.34));
  }
  .falling-piece svg { width:100%; height:100%; display:block; overflow:visible; }
  .falling-piece img { width:100%; height:100%; display:block; object-fit:contain; }
  .falling-piece.dot {
    width:var(--size);
    height:var(--size);
    border-radius:50%;
    background:currentColor;
    box-shadow:0 0 5px rgba(236,205,159,.78), 0 0 11px rgba(236,205,159,.48), 0 0 18px rgba(236,205,159,.24);
  }
  @keyframes gentleFall {
    0% {
      transform:translate3d(0,-8vh,0) rotate(var(--rotate-start));
      opacity:0;
    }
    8% { opacity:var(--opacity); }
    46% {
      transform:translate3d(var(--drift-mid),52vh,0) rotate(var(--rotate-mid));
      opacity:var(--opacity);
    }
    92% { opacity:var(--opacity); }
    100% {
      transform:translate3d(var(--drift-end),118vh,0) rotate(var(--rotate-end));
      opacity:0;
    }
  }
  @media (prefers-reduced-motion: reduce) {
    .falling-foreground { display:none; }
  }

</style>

<script>
(() => {
  const $ = id => document.getElementById(id);
  const svg = $('card');
  const photo = $('photo');
  const state = { imgW:1080, imgH:1350, imgHref:photo.getAttribute('href') };
  const exportScale = 2;
  const constants = { cardX:18, cardY:18, cardW:1044, cardH:1314, photoFrameY:18, photoFrameH:730, splitW:522, splitCenterX:801 };
  const defaults = {
    name1:'沐桑', name2:'沐桑', date:'3064/08/57', hashtag:'#沐沐桑桑', quote:'瑟瑟當道，自攻自受',
    zoom:100, posX:0, posY:0, textScale:100, quoteScale:100, fontStyle:'serif', quoteFont:'serif', theme:'beige', customColors:false, markEnabled:true, markStyle:'rose', markPosition:'center', hashPosition:'right', markSize:100, cornerRadius:38, layout:'top-bottom'
  };

  const themes = {
    white: { panel:'url(#whitePanel)', text:'#3a342e', accent:'#b28a61', transparent:false, vignette:null, textFilter:'' },
    beige: { panel:'#efe8dc', text:'#3a332c', accent:'#b08a61', transparent:false, vignette:null, textFilter:'' },
    silver: { panel:'url(#silverPanel)', text:'#42474f', accent:'#8993a2', transparent:false, vignette:null, textFilter:'' },
    black: { panel:'url(#blackPanel)', text:'#f3ede5', accent:'#c5a073', transparent:false, vignette:null, textFilter:'url(#darkTextShadow)' },
    'transparent-dark': { panel:'#000000', text:'#ffffff', accent:'#f0d2a4', transparent:true, vignette:null, textFilter:'url(#lightTextShadow)' },
    'transparent-light': { panel:'#ffffff', text:'#2a2926', accent:'#b28a61', transparent:true, vignette:null, textFilter:'url(#darkTextShadow)' },
    'vignette-black': { panel:'#000000', text:'#ffffff', accent:'#f0d2a4', transparent:true, vignette:'black', textFilter:'url(#lightTextShadow)' },
    'vignette-white': { panel:'#ffffff', text:'#2a2926', accent:'#b28a61', transparent:true, vignette:'white', textFilter:'' }
  };

  const serif = '"Noto Serif TC","Source Han Serif TC","PMingLiU","LiSong Pro","Songti TC",serif';
  const sans = '"Noto Sans TC",-apple-system,BlinkMacSystemFont,"PingFang TC","Microsoft JhengHei",sans-serif';
  const fontFamilies = {
    serif,
    sans,
    chenyu: '"ChenYuluoyanWeb",' + serif,
    huninn: '"OpenHuninnWeb",' + sans,
    glow: '"GlowSansSCWeb",' + sans,
    starpanda: '"StarPandaKidsWeb",' + sans,
    proper: '"ProperScriptWeb",' + serif
  };

  const bundledFontNames = {
    ChenYuluoyanWeb: 'ChenYuluoyan-2.0-Thin.woff2',
    OpenHuninnWeb: 'jf-openhuninn-2.1.woff2',
    GlowSansSCWeb: 'GlowSansSC-Condensed-Regular.woff2',
    StarPandaKidsWeb: 'StarPandaKidsBeta2.1.woff2',
    ProperScriptWeb: 'ProperScript-Regular.woff2'
  };
  const fontCdnBase = 'https://cdn.jsdelivr.net/gh/musun7755/wedding-card-editor@74cc700a9ba8f44a777de7fcf9e3a913b09df9fb/assets/fonts/';
  const bundledFontFiles = Object.fromEntries(Object.entries(bundledFontNames).map(([family, name]) => [family, fontCdnBase + name]));
  const bundledFontFallbackFiles = Object.fromEntries(Object.entries(bundledFontNames).map(([family, name]) => [family, './assets/fonts/' + name]));

  const bundledFontModes = {
    chenyu:'ChenYuluoyanWeb', huninn:'OpenHuninnWeb', glow:'GlowSansSCWeb',
    starpanda:'StarPandaKidsWeb', proper:'ProperScriptWeb'
  };
  const fontDataCache = new Map();
  const fontWarmupPromises = new Map();

  async function fetchBundledFont(family) {
    const primary = bundledFontFiles[family];
    const fallback = new URL(bundledFontFallbackFiles[family], document.baseURI).href;
    try {
      const response = await fetch(primary);
      if (!response.ok) throw new Error(`${primary}: HTTP ${response.status}`);
      return { url:primary, response };
    } catch (error) {
      const response = await fetch(fallback);
      if (!response.ok) throw new Error(`${fallback}: HTTP ${response.status}`);
      return { url:fallback, response };
    }
  }

  function warmBundledFonts() {
    const loadAll = () => Object.keys(bundledFontFiles).forEach(family => {
      const ready = document.fonts.load(`400 28px "${family}"`, '字體測試');
      fontWarmupPromises.set(family, ready);
      ready.catch(error => {
        console.warn('Bundled font load failed:', family, error);
      });
    });
    requestAnimationFrame(loadAll);
    if ('serviceWorker' in navigator) navigator.serviceWorker.getRegistration('./').then(registration => registration?.unregister()).catch(() => {});
  }

  async function loadSelectedFonts() {
    const selected = new Set([$('fontStyle').value, $('quoteFont').value]);
    await Promise.all([...selected].map(mode => {
      const family = bundledFontModes[mode];
      return family ? (fontWarmupPromises.get(family) || document.fonts.load(`400 28px "${family}"`)) : Promise.resolve();
    }));
  }

  function fontDataUrl(family) {
    if (!fontDataCache.has(family)) {
      fontDataCache.set(family, fetchBundledFont(family).then(({ response }) => response.arrayBuffer()).then(buffer => {
        const bytes = new Uint8Array(buffer);
        const parts = [];
        for (let i = 0; i < bytes.length; i += 0x8000) {
          parts.push(String.fromCharCode(...bytes.subarray(i, i + 0x8000)));
        }
        return `data:font/woff2;base64,${btoa(parts.join(''))}`;
      }).catch(error => {
        fontDataCache.delete(family);
        throw error;
      }));
    }
    return fontDataCache.get(family);
  }

  async function embedSelectedFonts(clone) {
    const selected = new Set([$('fontStyle').value, $('quoteFont').value]);
    const families = [...selected].map(mode => bundledFontModes[mode]).filter(Boolean);
    if (!families.length) return;
    const rules = await Promise.all(families.map(async family => {
      const source = await fontDataUrl(family);
      return `@font-face{font-family:"${family}";src:url("${source}") format("woff2");font-style:normal;font-weight:400}`;
    }));
    const style = document.createElementNS('http://www.w3.org/2000/svg', 'style');
    style.textContent = rules.join('\n');
    clone.insertBefore(style, clone.firstChild);
  }

  const rasterMarkIds = ['bottomHearts','bottomBow1','bottomBow3','bottomBow4'];
  const rasterMarkBaseHrefs = Object.fromEntries(rasterMarkIds.map(id => [id, $(id)?.getAttribute('href') || '']));
  const rasterMarkTintCache = new Map();
  let rasterMarkVersion = 0;
  let pendingRasterMarks = Promise.resolve();

  function hexToRgb(hex) {
    const v = (hex || '').replace('#','').trim();
    const full = v.length === 3 ? v.split('').map(ch => ch + ch).join('') : v;
    return [
      parseInt(full.slice(0,2), 16) || 0,
      parseInt(full.slice(2,4), 16) || 0,
      parseInt(full.slice(4,6), 16) || 0
    ];
  }

  function recolorRasterMark(href, color) {
    const key = `${href}|${(color || '').toLowerCase()}`;
    if (rasterMarkTintCache.has(key)) return rasterMarkTintCache.get(key);
    const task = new Promise((resolve, reject) => {
      const img = new Image();
      img.onload = () => {
        try {
        const canvas = document.createElement('canvas');
        canvas.width = img.width;
        canvas.height = img.height;
        const ctx = canvas.getContext('2d');
        ctx.drawImage(img, 0, 0);
        const imgData = ctx.getImageData(0, 0, canvas.width, canvas.height);
        const data = imgData.data;
        const [tr, tg, tb] = hexToRgb(color);
        for (let i = 0; i < data.length; i += 4) {
          if (!data[i + 3]) continue;
          const lum = (0.299 * data[i] + 0.587 * data[i + 1] + 0.114 * data[i + 2]) / 255;
          const shade = 0.72 + lum * 0.44;
          data[i] = Math.max(0, Math.min(255, Math.round(tr * shade)));
          data[i + 1] = Math.max(0, Math.min(255, Math.round(tg * shade)));
          data[i + 2] = Math.max(0, Math.min(255, Math.round(tb * shade)));
        }
        ctx.putImageData(imgData, 0, 0);
        resolve(canvas.toDataURL('image/png'));
        } catch (error) {
          reject(error);
        }
      };
      img.onerror = () => reject(new Error(`Image load failed: ${href}`));
      img.src = href;
    });
    rasterMarkTintCache.set(key, task);
    return task;
  }

  function updateRasterMarkColors(accentColor) {
    const version = ++rasterMarkVersion;
    pendingRasterMarks = Promise.all(rasterMarkIds.map(async id => {
      const baseHref = rasterMarkBaseHrefs[id];
      if (!baseHref) return;
      const url = await recolorRasterMark(baseHref, accentColor);
      if (version === rasterMarkVersion) {
        const el = $(id);
        if (el) el.setAttribute('href', url);
      }
    }));
    pendingRasterMarks.catch(error => console.error('Decoration load failed:', error));
  }

  function getLayoutMetrics() {
    const isSplit = $('layoutSelect').value === 'left-right';
    if (isSplit) {
      return {
        isSplit: true,
        viewW: 1350, viewH: 1080,
        cardX: 18, cardY: 18, cardW: 1314, cardH: 1044,
        splitX: 675, splitW: 657, splitCenterX: 1003.5,
        photoFrameY: 18, photoFrameH: 1044
      };
    }
    return {
      isSplit: false,
      viewW: 1080, viewH: 1350,
      cardX: 18, cardY: 18, cardW: 1044, cardH: 1314,
      splitX: 540, splitW: 522, splitCenterX: 801,
      photoFrameY: 18, photoFrameH: 730
    };
  }

  function applyLayoutCanvas() {
    const m = getLayoutMetrics();
    svg.setAttribute('viewBox', `0 0 ${m.viewW} ${m.viewH}`);
    svg.style.aspectRatio = `${m.viewW} / ${m.viewH}`;
    $('outputSizeLabel').textContent = `${m.viewW * exportScale} × ${m.viewH * exportScale}`;

    ['cardClipRect','cardSurface'].forEach(id => {
      $(id).setAttribute('x', m.cardX);
      $(id).setAttribute('y', m.cardY);
      $(id).setAttribute('width', m.cardW);
      $(id).setAttribute('height', m.cardH);
    });

    if (m.isSplit) {
      $('lowerPanel').setAttribute('x', m.splitX);
      $('lowerPanel').setAttribute('y', m.cardY);
      $('lowerPanel').setAttribute('width', m.splitW);
      $('lowerPanel').setAttribute('height', m.cardH);
    } else {
      $('lowerPanel').setAttribute('x', 18);
      $('lowerPanel').setAttribute('y', 748);
      $('lowerPanel').setAttribute('width', 1044);
      $('lowerPanel').setAttribute('height', 584);
      $('vignetteOverlay').setAttribute('x', 18);
      $('vignetteOverlay').setAttribute('y', 650);
      $('vignetteOverlay').setAttribute('width', 1044);
      $('vignetteOverlay').setAttribute('height', 682);
    }
  }

  function fitPhoto() {
    const theme = themes[$('themeSelect').value];
    const m = getLayoutMetrics();
    const splitPhotoExtends = m.isSplit && !!theme.transparent;
    const useFullCardPhoto = (!m.isSplit && !!theme.transparent) || splitPhotoExtends;

    const x = m.cardX;
    const y = m.cardY;
    const w = m.isSplit ? (splitPhotoExtends ? m.cardW : m.splitW) : m.cardW;
    const h = m.isSplit ? m.cardH : (useFullCardPhoto ? m.cardH : m.photoFrameH);

    const zoom = +$('zoom').value / 100;
    const base = Math.max(w / state.imgW, h / state.imgH);
    const scale = base * zoom;
    const rw = state.imgW * scale, rh = state.imgH * scale;
    const extraX = Math.max(0, rw - w), extraY = Math.max(0, rh - h);
    const px = +$('posX').value / 100, py = +$('posY').value / 100;
    // Extend the photo beneath the clipping edge to avoid a hairline from pixel rounding.
    const bleed = 2;
    const ix = x - extraX / 2 - px * extraX / 2 - bleed;
    const iy = y - extraY / 2 - py * extraY / 2 - bleed;
    photo.setAttribute('x', ix.toFixed(2));
    photo.setAttribute('y', iy.toFixed(2));
    photo.setAttribute('width', (rw + bleed * 2).toFixed(2));
    photo.setAttribute('height', (rh + bleed * 2).toFixed(2));
  }

  function updateCornerRadius() {
    const r = +$('cornerRadius').value;
    $('cornerRadiusV').value = r;
    $('cardClipRect').setAttribute('rx', r);
    $('cardClipRect').setAttribute('ry', r);
    $('cardSurface').setAttribute('rx', r);
    $('cardSurface').setAttribute('ry', r);
    svg.style.borderRadius = Math.max(8, Math.round(r * 0.48)) + 'px';
  }

  let fontSampleVersion = 0;
  function updateFontSample(id, mode, family, text, version) {
    const sample = $(id);
    sample.style.fontFamily = family;
    sample.classList.remove('is-loading', 'is-error');
    sample.textContent = text;
    const bundledFamily = bundledFontModes[mode];
    if (!bundledFamily) return;
    const fontSpec = `400 28px "${bundledFamily}"`;
    sample.classList.add('is-loading');
    sample.textContent = '字體載入中…';
    (fontWarmupPromises.get(bundledFamily) || document.fonts.load(fontSpec, text)).then(faces => {
      if (!faces.length) throw new Error(`${bundledFamily} unavailable`);
      if (version !== fontSampleVersion) return;
      sample.classList.remove('is-loading');
      sample.textContent = text;
    }).catch(error => {
      if (version !== fontSampleVersion) return;
      sample.classList.remove('is-loading');
      sample.classList.add('is-error');
      sample.textContent = '字體載入失敗';
      console.warn('Bundled font load failed:', error);
    });
  }

  function setFont() {
    const mode = $('fontStyle').value;
    const quoteMode = $('quoteFont').value;

    const names = fontFamilies[mode] || serif;

    $('name1Text').setAttribute('font-family', names);
    $('name2Text').setAttribute('font-family', names);
    $('dateText').setAttribute('font-family', names);
    $('hashText').setAttribute('font-family', names);
    $('quoteText').setAttribute('font-family', fontFamilies[quoteMode] || serif);

    $('name1Text').setAttribute('font-weight', '400');
    $('name2Text').setAttribute('font-weight', '400');
    $('dateText').setAttribute('font-weight', '400');
    $('hashText').setAttribute('font-weight', '400');
    $('quoteText').setAttribute('font-weight', '400');
    const version = ++fontSampleVersion;
    updateFontSample('mainFontSample', mode, names, '字體測試', version);
    updateFontSample('quoteFontSample', quoteMode, fontFamilies[quoteMode] || serif, '字體測試', version);
  }

  function wrapQuote(text, scale) {
    const el = $('quoteText');
    while (el.firstChild) el.removeChild(el.firstChild);
    const cleaned = (text || '').trim() || ' ';
    const chars = [...cleaned];
    const m = getLayoutMetrics();
    const max = m.isSplit ? 16 : 24;
    let lines = [];
    if (chars.length <= max) lines = [cleaned];
    else {
      let cut = Math.ceil(chars.length / 2);
      const punct = ['，','。','、','；','：','！','？',',','.',' '];
      let best = cut;
      outer: for (let d = 0; d < 8; d++) {
        for (const idx of [cut-d, cut+d]) {
          if (idx > 0 && idx < chars.length && punct.includes(chars[idx-1])) { best = idx; break outer; }
        }
      }
      lines = [chars.slice(0,best).join('').trim(), chars.slice(best).join('').trim()];
    }
    const quoteY = +el.dataset.baseY;
    const start = lines.length === 1 ? quoteY : quoteY - 20 * scale;
    const lineX = m.isSplit ? m.splitCenterX : 540;
    lines.forEach((line, i) => {
      const t = document.createElementNS('http://www.w3.org/2000/svg', 'tspan');
      t.setAttribute('x', String(lineX));
      t.setAttribute('y', String(start + i * 42 * scale));
      t.textContent = line;
      el.appendChild(t);
    });
  }

  function updateLayout() {
    const scale = +$('textScale').value / 100;
    const quoteScale = +$('quoteScale').value / 100;
    const m = getLayoutMetrics();
    applyLayoutCanvas();

    $('name1Text').setAttribute('font-size', 46 * scale * 0.80);
    $('name2Text').setAttribute('font-size', 46 * scale * 0.80);
    $('dateText').setAttribute('font-size', 30 * scale * 0.90);
    $('hashText').setAttribute('font-size', 25 * scale * 1.00);
    $('quoteText').setAttribute('font-size', 28 * quoteScale * 1.00);

    if (m.isSplit) {
      const cx = m.splitCenterX;
      const splitTheme = themes[$('themeSelect').value];
      $('photoRatioHint').textContent = splitTheme.transparent ? '（建議橫式 4:3 / 3:2）' : '（建議直式 3:4 / 2:3）';

      $('name1Text').setAttribute('x', cx - 78);
      $('name1Text').setAttribute('y', 352);
      $('name1Text').setAttribute('text-anchor', 'end');
      $('name2Text').setAttribute('x', cx + 78);
      $('name2Text').setAttribute('y', 352);
      $('name2Text').setAttribute('text-anchor', 'start');

      $('leftLine').setAttribute('x1', cx - 58); $('leftLine').setAttribute('x2', cx - 30);
      $('leftLine').setAttribute('y1', 338); $('leftLine').setAttribute('y2', 338);
      $('rightLine').setAttribute('x1', cx + 30); $('rightLine').setAttribute('x2', cx + 58);
      $('rightLine').setAttribute('y1', 338); $('rightLine').setAttribute('y2', 338);
      $('ringMark').setAttribute('transform', `translate(${cx} 337)`);

      $('dateText').setAttribute('x', cx);
      $('dateText').setAttribute('y', 480);
      $('quoteLine').setAttribute('x1', cx - 18); $('quoteLine').setAttribute('x2', cx + 18);
      $('quoteLine').setAttribute('y1', 555); $('quoteLine').setAttribute('y2', 555);
      $('quoteText').setAttribute('x', cx);
      $('quoteText').dataset.baseY = 665;
    } else {
      $('photoRatioHint').textContent = '（建議 4:3 / 3:2）';

      $('name1Text').setAttribute('x', 458);
      $('name1Text').setAttribute('y', 896);
      $('name1Text').setAttribute('text-anchor', 'end');
      $('name2Text').setAttribute('x', 622);
      $('name2Text').setAttribute('y', 896);
      $('name2Text').setAttribute('text-anchor', 'start');

      $('leftLine').setAttribute('x1', 478); $('leftLine').setAttribute('x2', 510);
      $('leftLine').setAttribute('y1', 881); $('leftLine').setAttribute('y2', 881);
      $('rightLine').setAttribute('x1', 570); $('rightLine').setAttribute('x2', 602);
      $('rightLine').setAttribute('y1', 881); $('rightLine').setAttribute('y2', 881);
      $('ringMark').setAttribute('transform', 'translate(540 880)');

      $('dateText').setAttribute('x', 540);
      $('dateText').setAttribute('y', 992);
      $('quoteLine').setAttribute('x1', 522); $('quoteLine').setAttribute('x2', 558);
      $('quoteLine').setAttribute('y1', 1058); $('quoteLine').setAttribute('y2', 1058);
      $('quoteText').setAttribute('x', 540);
      $('quoteText').dataset.baseY = 1164;
    }

    wrapQuote($('quote').value, quoteScale);
    updatePositions();
    fitPhoto();
    updateCornerRadius();
  }

  function updateCustomGradientDefs() {
    const panel = $('customBgBottom').value;
    const vig = $('customVignette').value;
    $('customPanelTop').setAttribute('stop-color', panel);
    $('customPanelBottom').setAttribute('stop-color', panel);
    ['customVig0','customVig1','customVig2','customVig3','customHVig0','customHVig1','customHVig2','customHVig3'].forEach(id => $(id).setAttribute('stop-color', vig));
  }

  function updateMark() {
    const enabled = $('markEnabled').checked;
    const style = $('markStyle').value;
    const groups = {
      rose: $('bottomRose'),
      bow1: $('bottomBow1'),
      bow4: $('bottomBow4'),
      bow3: $('bottomBow3'),
      hearts: $('bottomHearts'),
      xi: $('bottomXi'),
      knot: $('bottomKnot')
    };
    Object.entries(groups).forEach(([key, el]) => {
      el.style.display = enabled && style === key ? '' : 'none';
    });
    updatePositions();
  }

  function updatePositions() {
    const hashPos = $('hashPosition').value;
    const markPos = $('markPosition').value;
    const m = getLayoutMetrics();
    const hashMap = m.isSplit ? {
      left: { x: 735, anchor: 'start' },
      center: { x: m.splitCenterX, anchor: 'middle' },
      right: { x: 1272, anchor: 'end' }
    } : {
      left: { x: 68, anchor: 'start' },
      center: { x: 540, anchor: 'middle' },
      right: { x: 1012, anchor: 'end' }
    };
    const markMap = m.isSplit ? { left: 760, center: m.splitCenterX, right: 1246 } : { left: 92, center: 540, right: 988 };
    const h = hashMap[hashPos] || hashMap.right;
    $('hashText').setAttribute('x', h.x);
    $('hashText').setAttribute('text-anchor', h.anchor);
    $('hashText').setAttribute('y', m.isSplit ? 1012 : 1278);

    const markScales = { rose:0.58, bow1:0.138, bow3:0.150, bow4:0.070, hearts:0.132, xi:0.68, knot:0.68 };
    const markHalfWidths = { rose:32, bow1:271.5, bow3:726.5, bow4:723.5, hearts:254, xi:34, knot:48 };
    const markBottomExtents = { rose:68, bow1:274, bow3:473, bow4:457.5, hearts:282, xi:42, knot:24 };
    // Several PNGs have transparent padding; align the visible artwork above the hashtag.
    const markVisibleBottomExtents = { rose:68, bow1:176, bow3:178, bow4:330.5, hearts:100, xi:42, knot:16 };
    const markBottomNudges = { rose:10, bow1:10, bow3:14, bow4:11, hearts:14, xi:9, knot:9 };
    const markScaleFactor = (+$('markSize').value || 100) / 100;
    const activeStyle = $('markStyle').value;
    const activeScale = (markScales[activeStyle] || 0.58) * markScaleFactor;
    const activeHalfW = (markHalfWidths[activeStyle] || 40) * activeScale;
    const hashBaselineY = m.isSplit ? 1012 : 1278;
    const samePosition = hashPos === markPos && !!$('hashtag').value.trim();
    const hashFontSize = +$('hashText').getAttribute('font-size') || 25;
    const targetBottomY = hashBaselineY + 18;
    const sharedMarkBottomY = hashBaselineY - hashFontSize * 1.05 - 12;
    const safeGap = m.isSplit ? 60 : 50;
    const regionLeft = m.isSplit ? m.splitX : m.cardX;
    const regionRight = m.cardX + m.cardW;
    const desiredMarkX = markMap[markPos] || (m.isSplit ? m.splitCenterX : 540);
    const minMarkX = regionLeft + safeGap + activeHalfW;
    const maxMarkX = regionRight - safeGap - activeHalfW;
    const markX = Math.max(minMarkX, Math.min(maxMarkX, desiredMarkX));

    ['rose','bow1','bow3','bow4','hearts','xi','knot'].forEach(style => {
      const el = $({ rose:'bottomRose', bow1:'bottomBow1', bow3:'bottomBow3', bow4:'bottomBow4', hearts:'bottomHearts', xi:'bottomXi', knot:'bottomKnot' }[style]);
      const scale = (markScales[style] || 0.58) * markScaleFactor;
      const markY = samePosition
        ? sharedMarkBottomY - (markVisibleBottomExtents[style] || 40) * scale
        : targetBottomY - (markBottomExtents[style] || 40) * scale + (markBottomNudges[style] || 0);
      el.setAttribute('transform', `translate(${markX} ${markY}) scale(${scale})`);
    });
  }

  function updateCenterMotif() {
    const selected = $('centerMotif').value;
    $('ringMark').querySelectorAll('[data-center-motif]').forEach(motif => {
      motif.style.display = motif.dataset.centerMotif === selected ? '' : 'none';
    });
  }

  function updateTheme() {
    updateCustomGradientDefs();
    const theme = themes[$('themeSelect').value];
    const custom = $('customColorsEnabled').checked;
    const panelFill = custom ? $('customBgBottom').value : theme.panel;
    const textColor = custom ? $('customText').value : theme.text;
    const accentColor = custom ? $('customAccent').value : theme.accent;

    const m = getLayoutMetrics();
    const isSplit = m.isSplit;
    applyLayoutCanvas();
    $('cardSurface').setAttribute('fill', 'transparent');
    $('lowerPanel').setAttribute('fill', panelFill);
    if (isSplit) {
      $('lowerPanel').setAttribute('x', m.splitX);
      $('lowerPanel').setAttribute('y', m.cardY);
      $('lowerPanel').setAttribute('width', m.splitW);
      $('lowerPanel').setAttribute('height', m.cardH);
      $('lowerPanel').setAttribute('fill-opacity', theme.transparent ? '0' : '1');
    } else {
      $('lowerPanel').setAttribute('x', '18');
      $('lowerPanel').setAttribute('y', '748');
      $('lowerPanel').setAttribute('width', '1044');
      $('lowerPanel').setAttribute('height', '584');
      $('lowerPanel').setAttribute('fill-opacity', theme.transparent ? '0' : '1');
    }

    ['name1Text','name2Text','dateText','hashText','quoteText'].forEach(id => {
      $(id).setAttribute('fill', textColor);
      if (!custom && theme.textFilter) $(id).setAttribute('filter', theme.textFilter);
      else $(id).removeAttribute('filter');
    });
    ['leftLine','rightLine','quoteLine'].forEach(id => $(id).setAttribute('stroke', accentColor));
    $('ringMark').setAttribute('stroke', accentColor);
    $('ringMark').style.color = accentColor;
    updateCenterMotif();
    svg.querySelectorAll('.mark-stroke').forEach(el => el.setAttribute('stroke', accentColor));
    svg.querySelectorAll('.mark-fill-accent').forEach(el => el.setAttribute('fill', accentColor));
    svg.querySelectorAll('.mark-fill-contrast').forEach(el => el.setAttribute('fill', textColor));
    updateRasterMarkColors(accentColor);
    fitPhoto();

    const vig = $('vignetteOverlay');
    const controls = $('vignetteControls');
    if (theme.vignette) {
      controls.style.display = '';
      if (isSplit) {
        const vignetteStartX = m.splitX - m.splitW * 0.25;
        vig.setAttribute('x', vignetteStartX);
        vig.setAttribute('y', m.cardY);
        vig.setAttribute('width', m.cardX + m.cardW - vignetteStartX);
        vig.setAttribute('height', m.cardH);
        if (custom) vig.setAttribute('fill', 'url(#customVignetteHorizontal)');
        else vig.setAttribute('fill', theme.vignette === 'black' ? 'url(#vignetteBlackHorizontal)' : 'url(#vignetteWhiteHorizontal)');
      } else {
        vig.setAttribute('x', '18');
        vig.setAttribute('y', '650');
        vig.setAttribute('width', '1044');
        vig.setAttribute('height', '682');
        if (custom) vig.setAttribute('fill', 'url(#customVignetteGradient)');
        else vig.setAttribute('fill', theme.vignette === 'black' ? 'url(#vignetteBlack)' : 'url(#vignetteWhite)');
      }
      updateVignetteOpacity();
    } else {
      controls.style.display = 'none';
      vig.setAttribute('opacity', '0');
    }
    updateLayout();
    updateMark();
  }

  const vignetteStops = ['customVignetteGradient','customVignetteHorizontal','vignetteBlackHorizontal','vignetteWhiteHorizontal','vignetteBlack','vignetteWhite']
    .flatMap(id => [...$(id).querySelectorAll('stop')].map(stop => ({ stop, base: +stop.getAttribute('stop-opacity') })));

  function updateVignetteOpacity() {
    const theme = themes[$('themeSelect').value];
    const value = +$('vignetteOpacity').value;
    $('vignetteOpacityV').textContent = value + '%';
    const strength = Math.max(1, value / 100);
    vignetteStops.forEach(({ stop, base }) => stop.setAttribute('stop-opacity', String(Math.min(1, base * strength))));
    if (!theme.vignette) {
      $('vignetteOverlay').setAttribute('opacity', '0');
      return;
    }
    $('vignetteOverlay').setAttribute('opacity', String(Math.min(1, value / 100)));
  }

  function updateText() {
    $('name1Text').textContent = $('name1').value;
    $('name2Text').textContent = $('name2').value;
    $('dateText').textContent = $('date').value;
    $('hashText').textContent = $('hashtag').value || '';
    updateLayout();
  }

  function updateValues() {
    $('zoomV').value = $('zoom').value;
    $('posXV').value = $('posX').value;
    $('posYV').value = $('posY').value;
    $('textScaleV').textContent = $('textScale').value + '%';
    $('quoteScaleV').textContent = $('quoteScale').value + '%';
    $('markSizeV').textContent = $('markSize').value + '%';
    $('cornerRadiusV').value = $('cornerRadius').value;
  }

  function loadPhoto(file) {
    if (!file || !file.type.startsWith('image/')) return;
    const reader = new FileReader();
    reader.onload = e => {
      const img = new Image();
      img.onload = () => {
        state.imgW = img.naturalWidth;
        state.imgH = img.naturalHeight;
        state.imgHref = e.target.result;
        photo.setAttribute('href', state.imgHref);
        fitPhoto();
      };
      img.src = e.target.result;
    };
    reader.readAsDataURL(file);
  }

  $('photoInput').addEventListener('change', e => loadPhoto(e.target.files[0]));
  ['zoom','posX','posY','textScale','quoteScale'].forEach(id => $(id).addEventListener('input', () => { updateValues(); updateLayout(); }));
  $('cornerRadius').addEventListener('input', () => { updateValues(); updateCornerRadius(); });
  [['zoom','zoomV'],['posX','posXV'],['posY','posYV'],['cornerRadius','cornerRadiusV']].forEach(([rangeId, editId]) => {
    const range = $(rangeId), edit = $(editId);
    const applyEdit = clamp => {
      if (edit.value === '' || !Number.isFinite(edit.valueAsNumber)) {
        if (clamp) edit.value = range.value;
        return;
      }
      const raw = Math.round(edit.valueAsNumber);
      if (!clamp && (raw < +range.min || raw > +range.max)) return;
      range.value = String(Math.max(+range.min, Math.min(+range.max, raw)));
      range.dispatchEvent(new Event('input', { bubbles:true }));
    };
    edit.addEventListener('input', () => applyEdit(false));
    edit.addEventListener('change', () => applyEdit(true));
  });
  ['name1','name2','date','hashtag','quote'].forEach(id => $(id).addEventListener('input', updateText));
  $('fontStyle').addEventListener('change', setFont);
  $('quoteFont').addEventListener('change', setFont);
  $('layoutSelect').addEventListener('change', updateTheme);
  $('themeSelect').addEventListener('change', updateTheme);
  $('vignetteOpacity').addEventListener('input', updateVignetteOpacity);
  $('customColorsEnabled').addEventListener('change', updateTheme);
  ['customBgBottom','customText','customAccent','customVignette'].forEach(id => $(id).addEventListener('input', updateTheme));
  $('markEnabled').addEventListener('change', updateMark);
  $('centerMotif').addEventListener('change', updateCenterMotif);
  $('markStyle').addEventListener('change', () => {
    $('markEnabled').checked = true;
    updateMark();
  });
  $('markPosition').addEventListener('change', updatePositions);
  $('markSize').addEventListener('input', () => { updateValues(); updatePositions(); });
  $('hashPosition').addEventListener('change', updatePositions);
  svg.addEventListener('dragover', e => e.preventDefault());
  svg.addEventListener('drop', e => { e.preventDefault(); loadPhoto(e.dataTransfer.files[0]); });

  const previewExpandBtn = $('previewExpandBtn');
  function setPreviewExpanded(expanded) {
    document.body.classList.toggle('preview-expanded', expanded);
    previewExpandBtn.setAttribute('aria-expanded', expanded ? 'true' : 'false');
    previewExpandBtn.textContent = expanded ? '關閉預覽' : '放大預覽';
    if (expanded) {
      requestAnimationFrame(() => {
        const stage = document.querySelector('.stage');
        stage.scrollLeft = (stage.scrollWidth - stage.clientWidth) / 2;
        stage.scrollTop = state.imgHref ? 0 : stage.scrollHeight - stage.clientHeight;
      });
    }
  }
  previewExpandBtn.addEventListener('click', () => {
    setPreviewExpanded(!document.body.classList.contains('preview-expanded'));
  });
  document.addEventListener('keydown', event => {
    if (event.key === 'Escape') setPreviewExpanded(false);
  });
  window.addEventListener('resize', () => {
    if (window.innerWidth > 860) setPreviewExpanded(false);
  });

  const mobileTabs = [...document.querySelectorAll('.mobile-tab')];
  const mobilePanels = [...document.querySelectorAll('.mobile-panel')];
  function setMobileTab(tabName) {
    mobileTabs.forEach(btn => {
      const active = btn.dataset.mobileTab === tabName;
      btn.classList.toggle('active', active);
      btn.setAttribute('aria-selected', active ? 'true' : 'false');
    });
    let first = true;
    mobilePanels.forEach(panel => {
      const active = panel.dataset.mobilePanel === tabName;
      panel.classList.toggle('mobile-active', active);
      panel.classList.toggle('mobile-first', active && first);
      if (active && first) first = false;
    });
    const settingsPanel = document.querySelector('.panel');
    if (settingsPanel && window.matchMedia('(max-width: 860px)').matches) settingsPanel.scrollTop = 0;
  }
  mobileTabs.forEach(btn => btn.addEventListener('click', () => setMobileTab(btn.dataset.mobileTab)));
  setMobileTab('photo');

  function resetCard() {
    $('centerMotif').value = 'rings';
    $('name1').value = defaults.name1;
    $('name2').value = defaults.name2;
    $('date').value = defaults.date;
    $('hashtag').value = defaults.hashtag;
    $('quote').value = defaults.quote;
    $('zoom').value = defaults.zoom;
    $('posX').value = defaults.posX;
    $('posY').value = defaults.posY;
    $('textScale').value = defaults.textScale;
    $('quoteScale').value = defaults.quoteScale;
    $('fontStyle').value = defaults.fontStyle;
    $('quoteFont').value = defaults.quoteFont;
    $('layoutSelect').value = defaults.layout;
    $('themeSelect').value = defaults.theme;
    $('customColorsEnabled').checked = defaults.customColors;
    $('markEnabled').checked = defaults.markEnabled;
    $('markStyle').value = defaults.markStyle;
    $('markPosition').value = defaults.markPosition;
    $('hashPosition').value = defaults.hashPosition;
    $('markSize').value = defaults.markSize;
    $('cornerRadius').value = defaults.cornerRadius;
    $('customBgBottom').value = '#efe8dc';
    $('customText').value = '#3a332c';
    $('customAccent').value = '#b08a61';
    $('customVignette').value = '#ffffff';
    $('vignetteOpacity').value = 72;
    state.imgW = 1080; state.imgH = 1350;
    state.imgHref = '';
    photo.setAttribute('href', state.imgHref);
    updateValues(); updateCornerRadius(); setFont(); updateText(); updateTheme(); updateMark();
  }
  ['resetBtn','mobileResetBtn'].forEach(id => $(id).addEventListener('click', resetCard));

  const isIOS = /iPad|iPhone|iPod/.test(navigator.userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
  const isMobileDevice = isIOS || /Android|Mobile/i.test(navigator.userAgent) || navigator.userAgentData?.mobile === true;
  if (isMobileDevice) $('mobileDownloadBtn').textContent = '儲存圖片';
  let exportPng = null;
  let exportImageUrl = null;

  function downloadPng(png) {
    const a = document.createElement('a');
    const url = URL.createObjectURL(png);
    a.href = url;
    a.download = 'wedding-card.png';
    a.click();
    setTimeout(() => URL.revokeObjectURL(url), 60000);
  }

  function closeExportDialog() {
    $('exportOverlay').hidden = true;
    $('exportImage').removeAttribute('src');
    if (exportImageUrl) URL.revokeObjectURL(exportImageUrl);
    exportImageUrl = null;
    exportPng = null;
    $('mobileDownloadBtn').focus();
  }

  function showExportDialog(png) {
    exportPng = png;
    exportImageUrl = URL.createObjectURL(png);
    $('exportImage').src = exportImageUrl;
    $('exportStatus').textContent = '';
    const file = new File([png], 'wedding-card.png', { type:'image/png' });
    const canShareImage = typeof navigator.share === 'function' &&
      typeof navigator.canShare === 'function' && navigator.canShare({ files:[file] });
    $('shareImageBtn').hidden = !canShareImage;
    $('exportHelp').textContent = canShareImage
      ? '點「分享圖片」，再從 iPhone 選單選「儲存影像」，就能存進相簿。'
      : '可長按上方圖片嘗試儲存影像，或點「下載檔案」。';
    $('exportOverlay').hidden = false;
    (canShareImage ? $('shareImageBtn') : $('downloadFileBtn')).focus();
  }

  $('shareImageBtn').addEventListener('click', async () => {
    if (!exportPng) return;
    const file = new File([exportPng], 'wedding-card.png', { type:'image/png' });
    const button = $('shareImageBtn');
    button.disabled = true;
    try {
      await navigator.share({ files:[file] });
      closeExportDialog();
    } catch (error) {
      if (error.name !== 'AbortError') {
        console.error('Image sharing failed:', error);
        $('exportStatus').textContent = '無法開啟分享選單。可長按圖片儲存，或改用「下載檔案」。';
      }
    } finally {
      button.disabled = false;
    }
  });
  $('downloadFileBtn').addEventListener('click', () => {
    if (!exportPng) return;
    downloadPng(exportPng);
    closeExportDialog();
  });
  $('exportCloseBtn').addEventListener('click', closeExportDialog);
  $('exportOverlay').addEventListener('click', event => {
    if (event.target === $('exportOverlay')) closeExportDialog();
  });
  document.addEventListener('keydown', event => {
    if (event.key === 'Escape' && !$('exportOverlay').hidden) closeExportDialog();
  });

  async function downloadCard(event) {
    const useShareFlow = isMobileDevice && event.currentTarget.id === 'mobileDownloadBtn';
    const buttons = [$('downloadBtn'), $('mobileDownloadBtn')];
    buttons.forEach(button => button.disabled = true);
    try {
      await loadSelectedFonts();
      await pendingRasterMarks;
      const m = getLayoutMetrics();
      const clone = svg.cloneNode(true);
      clone.removeAttribute('class');
      clone.setAttribute('viewBox', `${m.cardX + 1} ${m.cardY + 1} ${m.cardW - 2} ${m.cardH - 2}`);
      clone.setAttribute('preserveAspectRatio', 'none');
      clone.setAttribute('width', String(m.viewW * exportScale));
      clone.setAttribute('height', String(m.viewH * exportScale));
      await embedSelectedFonts(clone);
      const xml = new XMLSerializer().serializeToString(clone);
      const blob = new Blob([xml], { type:'image/svg+xml;charset=utf-8' });
      const url = URL.createObjectURL(blob);
      const img = new Image();
      try {
        await new Promise((resolve, reject) => {
          img.onload = resolve;
          img.onerror = () => reject(new Error('SVG image load failed'));
          img.src = url;
        });
        const canvas = document.createElement('canvas');
        canvas.width = m.viewW * exportScale;
        canvas.height = m.viewH * exportScale;
        const ctx = canvas.getContext('2d');
        ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
        const png = await new Promise((resolve, reject) => {
          canvas.toBlob(blob => blob ? resolve(blob) : reject(new Error('PNG encoding failed')), 'image/png');
        });
        if (useShareFlow) {
          const file = new File([png], 'wedding-card.png', { type:'image/png' });
          if (typeof navigator.share === 'function' && navigator.canShare?.({ files:[file] })) {
            try {
              await navigator.share({ files:[file] });
            } catch (error) {
              if (error.name !== 'AbortError') {
                console.warn('Direct image sharing failed:', error);
                showExportDialog(png);
              }
            }
          } else if (isIOS) showExportDialog(png);
          else downloadPng(png);
        } else downloadPng(png);
      } finally {
        URL.revokeObjectURL(url);
      }
    } catch (error) {
      console.error('PNG export failed:', error);
      alert('匯出失敗，請重新整理後再試。');
    } finally {
      buttons.forEach(button => button.disabled = false);
    }
  }
  ['downloadBtn','mobileDownloadBtn'].forEach(id => $(id).addEventListener('click', downloadCard));

  updateValues();
  updateCornerRadius();
  setFont();
  updateText();
  updateTheme();
  updateVignetteOpacity();
  warmBundledFonts();
})();
</script>

</body>
</html>
